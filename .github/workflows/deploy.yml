name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Locate build output
        id: out
        run: |
          echo "--- repo root after build ---"
          ls -la
          for d in dist docs build public/dist .output/public; do
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "Using build output: $d"
              exit 0
            fi
          done
          echo "ERROR: no folder containing index.html was found."
          exit 1

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 -H 187.77.24.185 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            "${{ steps.out.outputs.dir }}/" \
            root@187.77.24.185:/var/www/rajanghimire.com/